name: Daily YouTube Sync

on:
  schedule:
    - cron: '0 11 * * *'  # 3 AM Pacific (UTC-8)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run daily sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python3 ingest/daily_sync.py

      - name: Commit state files if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/embedded.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: daily sync state update [skip ci]"
            git push
          fi

      - name: Notify success
        if: success()
        run: |
          curl -s \
            -H "Title: Kingdom Age Sync OK" \
            -H "Tags: white_check_mark" \
            -d "Daily sync completed at $(date -u '+%Y-%m-%d %H:%M UTC')" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }}

      - name: Notify failure
        if: failure()
        run: |
          curl -s \
            -H "Title: Kingdom Age Sync FAILED" \
            -H "Tags: x,rotating_light" \
            -H "Priority: high" \
            -d "Daily sync failed — check GitHub Actions for details." \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }}
